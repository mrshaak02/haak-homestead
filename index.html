<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haak Homestead</title><style>
:root{font-family:"Trebuchet MS",Verdana,sans-serif;color:#403a34;background:#f6f2eb}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#fffaf4;border-bottom:1px solid #e9e0d4;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-family:"Times New Roman",Times,serif;font-weight:700;letter-spacing:-1.1px;font-size:30px;margin:0}header p{margin:5px 0 0;color:#8b7b6d;font-size:13px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#665b50;color:white}button.secondary{background:#eae1d7;color:#51483f}main{padding:20px}#board{height:calc(100vh - 160px);min-height:570px;position:relative;overflow:auto;border:1px dashed #d6c9b8;border-radius:20px;background-color:#fdfaf5;background-image:radial-gradient(#e9dfd3 1px,transparent 1px);background-size:22px 22px;touch-action:pan-x pan-y}.card{position:absolute;width:225px;min-height:145px;padding:16px;border-radius:14px;box-shadow:0 5px 18px #51433418;cursor:grab;user-select:none;touch-action:none}.card:active{cursor:grabbing}.card .emoji{font-size:26px}.card h3{font-size:19px;line-height:1.3;font-weight:500;letter-spacing:-.25px;margin:12px 0 8px;font-family:"Times New Roman",Times,serif}.card small{color:#695f55}.card .edit{position:absolute;right:12px;top:12px;border:0;background:#ffffffa8;color:#52493f;padding:5px 9px;font-size:12px}.hint{color:#82766b;font-size:13px;margin:0 0 12px}dialog{border:0;border-radius:20px;padding:26px;width:min(440px,92vw);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#30282080}dialog h2{font-family:"Times New Roman",Times,serif;margin-top:0}label{display:block;margin:13px 0 5px;font-size:13px;font-weight:650}input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid #d9cfc3;border-radius:9px;background:white}textarea{min-height:85px;resize:vertical}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.actions div{display:flex;gap:8px}#checklist{display:grid;gap:6px;margin-top:8px}.checkrow{display:flex;gap:8px;align-items:center}.checkrow input{width:auto}.checkrow input[type=text]{flex:1}.checkrow button{padding:5px 9px}.topactions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){header{padding:18px}h1{font-size:25px}main{padding:12px}#board{height:70vh}.card{width:190px}}
</style></head><body><header><div><h1>Haak Homestead ♡</h1><p>A little place for all our big ideas</p></div><div class="topactions"><button class="secondary" id="export">Back up</button><button class="secondary" id="import">Restore</button><button id="add">+ New project</button></div></header><main><p class="hint">Drag cards wherever you like · Tap Edit for notes and checklists · Changes save in this browser</p><div id="board"></div></main><dialog id="editor"><form method="dialog" id="form"><h2 id="modalTitle">Project details</h2><label for="name">Project name</label><input id="name" required maxlength="100"><label for="emoji">Little icon</label><input id="emoji" maxlength="8"><label for="color">Card colour</label><select id="color"><option value="#f2dfd5">Peach</option><option value="#e5e9d8">Sage</option><option value="#e3e3ed">Lavender</option><option value="#f7ebca">Buttercream</option><option value="#e3eaf0">Powder blue</option><option value="#f0dfe4">Blush</option></select><label for="notes">Notes / shopping ideas</label><textarea id="notes"></textarea><label>Checklist</label><div id="checklist"></div><button class="secondary" type="button" id="addCheck" style="margin-top:8px">+ Checklist item</button><div class="actions"><button type="button" class="secondary" id="delete">Delete</button><div><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit">Save project</button></div></div></form></dialog><input id="file" type="file" accept="application/json" hidden><script>
const key='our-little-home-v1';const defaults=[{id:'wc',name:'Paint both WCs',emoji:'🎨',color:'#f2dfd5',notes:'Choose colours and paint supplies',items:[{text:'Choose paint colours',done:false},{text:'Buy paint',done:false}],x:35,y:40},{id:'coop',name:'Finish chicken coop',emoji:'🐔',color:'#e5e9d8',notes:'',items:[],x:300,y:85},{id:'handles',name:'New wet-area handles',emoji:'🚪',color:'#e3e3ed',notes:'Kitchen, bathrooms and laundry',items:[],x:565,y:40},{id:'front',name:'Front verandah',emoji:'🌿',color:'#f7ebca',notes:'Make the entrance welcoming',items:[],x:90,y:270},{id:'door',name:'Paint the front door',emoji:'🖤',color:'#e3eaf0',notes:'Find the leftover black paint',items:[],x:370,y:310},{id:'garden',name:'Garden moments',emoji:'🌷',color:'#f0dfe4',notes:'Clothesline seat and back garden',items:[],x:650,y:265}];let cards;try{cards=JSON.parse(localStorage.getItem(key))||defaults}catch{cards=defaults}if(!Array.isArray(cards))cards=defaults;const board=document.getElementById('board'),dlg=document.getElementById('editor');let current=null;function save(){localStorage.setItem(key,JSON.stringify(cards))}function render(){board.innerHTML='';cards.forEach(c=>{let el=document.createElement('article');el.className='card';el.style.cssText=`left:${c.x}px;top:${c.y}px;background:${c.color}`;let icon=document.createElement('div');icon.className='emoji';icon.textContent=c.emoji||'🏡';let title=document.createElement('h3');title.textContent=c.name;let status=document.createElement('small');let done=(c.items||[]).filter(i=>i.done).length;status.textContent=(c.items||[]).length?`${done} of ${c.items.length} tasks done`:'A little idea in progress';let edit=document.createElement('button');edit.className='edit';edit.textContent='Edit ✎';edit.addEventListener('click',e=>{e.stopPropagation();open(c.id)});el.append(icon,title,status,edit);let drag=null;el.addEventListener('pointerdown',e=>{if(e.target===edit)return;drag={px:e.clientX,py:e.clientY,x:c.x,y:c.y};el.setPointerCapture(e.pointerId);el.style.zIndex='5'});el.addEventListener('pointermove',e=>{if(!drag)return;c.x=Math.max(0,drag.x+e.clientX-drag.px);c.y=Math.max(0,drag.y+e.clientY-drag.py);el.style.left=c.x+'px';el.style.top=c.y+'px'});el.addEventListener('pointerup',()=>{if(drag){drag=null;el.style.zIndex='';save()}});el.addEventListener('pointercancel',()=>{drag=null;save()});board.append(el)})}function checkRow(item={text:'',done:false}){let row=document.createElement('div');row.className='checkrow';let check=document.createElement('input');check.type='checkbox';check.checked=item.done;let txt=document.createElement('input');txt.type='text';txt.value=item.text;txt.placeholder='Something to do...';let del=document.createElement('button');del.type='button';del.textContent='×';del.className='secondary';del.onclick=()=>row.remove();row.append(check,txt,del);document.getElementById('checklist').append(row)}function open(id){current=id;let c=cards.find(x=>x.id===id)||{name:'',emoji:'🏡',color:'#f2dfd5',notes:'',items:[]};document.getElementById('modalTitle').textContent=id?'Edit project':'New project';['name','emoji','color','notes'].forEach(k=>document.getElementById(k).value=c[k]);document.getElementById('checklist').innerHTML='';(c.items||[]).forEach(checkRow);document.getElementById('delete').style.visibility=id?'visible':'hidden';dlg.showModal()}document.getElementById('add').onclick=()=>open(null);document.getElementById('addCheck').onclick=()=>checkRow();document.getElementById('cancel').onclick=()=>dlg.close();document.getElementById('form').onsubmit=e=>{e.preventDefault();let values={};['name','emoji','color','notes'].forEach(k=>values[k]=document.getElementById(k).value);values.items=[...document.querySelectorAll('.checkrow')].map(r=>({done:r.querySelector('input[type=checkbox]').checked,text:r.querySelector('input[type=text]').value.trim()})).filter(x=>x.text);if(current){Object.assign(cards.find(c=>c.id===current),values)}else{cards.push({id:crypto.randomUUID(),...values,x:30+board.scrollLeft,y:30+board.scrollTop})}save();render();dlg.close()};document.getElementById('delete').onclick=()=>{if(current&&confirm('Delete this project?')){cards=cards.filter(c=>c.id!==current);save();render();dlg.close()}};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='our-little-home-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v)||!v.every(x=>typeof x.name==='string'&&typeof x.x==='number'&&typeof x.y==='number'))throw Error();if(confirm('Replace your board with this backup?')){cards=v;save();render()}}catch{alert('That does not look like a valid board backup.')}e.target.value=''};render();
</script></body></html>
